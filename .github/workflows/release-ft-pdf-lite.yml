name: Release FT PDF Lite

permissions:
  contents: write

on:
  push:
    tags:
      - 'lite-v*'
      - 'v*-lite'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Tag de versão do release Lite (ex: lite-v2.1.0)'
        required: false
        default: 'lite-v2.1.0'

jobs:
  build-and-release-lite:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK 10
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Restore NuGet Dependencies (win-x64)
      run: dotnet restore ft-pdf-lite/FtPdfLite.csproj -r win-x64

    - name: Build FT PDF Lite
      run: dotnet build ft-pdf-lite/FtPdfLite.csproj -c Release -r win-x64 --no-restore

    - name: Publish FT PDF Lite (Standalone SingleFile)
      run: |
        dotnet publish ft-pdf-lite/FtPdfLite.csproj -c Release -r win-x64 -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true --self-contained true -o ./publish-ft-pdf-lite

    - name: Package Release ZIP
      shell: pwsh
      run: |
        Compress-Archive -Path ./publish-ft-pdf-lite/* -DestinationPath ./FT-PDF-Lite-Windows-x64.zip -Force

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FT-PDF-Lite-Windows-x64
        path: ./publish-ft-pdf-lite/

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name || inputs.version_tag }}
        name: "FT PDF Lite ${{ github.ref_name || inputs.version_tag }} (Edição Ultraleve)"
        body: |
          ### ⚡ Release FT PDF Lite - v2.3.1 (Edição Ultraleve)
          
          - **Leitor de PDF Vetorial Nativo** (Aceleração por Hardware)
          - **Múltiplas Abas Integradas**
          - **🔍 Validação e Diagnóstico de Integridade**
          - **📝 Bloco de Notas Integrado (Layout e Texto Cru)**
          - **Zero Ferramentas de Edição** (Focado exclusivamente em visualização rápida e segura)
          - **Fix Crítico:** Biblioteca nativa PDFium integrada e auto-extraível no executável único (100% Standalone)
          
          Baixe o executável abaixo para usar imediatamente!
        files: |
          ./publish-ft-pdf-lite/FtPdfLite.exe
          ./FT-PDF-Lite-Windows-x64.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
