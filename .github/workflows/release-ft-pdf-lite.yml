name: Release FT PDF Lite (Arquivo Único)

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
      - 'lite-v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Tag de versão do release (ex: v2.4.2)'
        required: false
        default: 'v2.4.2'

jobs:
  build-and-release-lite:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore NuGet Dependencies (win-x64)
      run: dotnet restore ft-pdf-lite/FtPdfLite.csproj -r win-x64

    - name: Build FT PDF Lite
      run: dotnet build ft-pdf-lite/FtPdfLite.csproj -c Release -r win-x64 --no-restore

    - name: Publish FT PDF Lite (Arquivo Único - Standalone SingleFile)
      run: |
        dotnet publish ft-pdf-lite/FtPdfLite.csproj -c Release -r win-x64 -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true --self-contained true -o ./publish-ft-pdf-lite

    - name: Package Release ZIP
      shell: pwsh
      run: |
        Compress-Archive -Path ./publish-ft-pdf-lite/FtPdfLite.exe -DestinationPath ./FT-PDF-Lite-Windows-x64.zip -Force

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FT-PDF-Lite-Windows-x64
        path: ./publish-ft-pdf-lite/

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name || inputs.version_tag }}
        name: "FT PDF Lite ${{ github.ref_name || inputs.version_tag }} (Arquivo Único)"
        body: |
          ### ⚡ Lançamento Oficial FT PDF Lite - ${{ github.ref_name || inputs.version_tag }} (Arquivo Único)
          
          - **Executável Único (.exe):** 100% Standalone Self-Contained, zero dependência de .NET instalado.
          - **PDFium Nativo Embutido:** Inicialização instantânea com aceleração de hardware.
          - **Leitura Vetorial de Alta Fidelidade:** Múltiplas abas, suporte a senhas e ajuste automático de tela.
          - **🔍 Validação e Diagnóstico de Integridade:** Classificação padronizada (`DOCUMENTO IMPORTÁVEL`, `DOCUMENTO IMPORTÁVEL, PORÉM PODE CONTER FALHAS`, `DOCUMENTO NÃO IMPORTÁVEL`) e detecção de microimagens/lançamentos em figura.
          - **📝 Bloco de Notas Integrado:** Extração limpa em texto cru e layout preservado.
          - **Diretriz de Retaguarda:** Procedimento padronizado integrado no diagnóstico.
          
          Baixe o arquivo executável único abaixo (`FtPdfLite.exe`) e execute diretamente com 2 cliques!
        files: |
          ./publish-ft-pdf-lite/FtPdfLite.exe
          ./FT-PDF-Lite-Windows-x64.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
