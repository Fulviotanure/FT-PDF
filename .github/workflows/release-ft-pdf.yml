name: Release FT PDF

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
      - 'ft-pdf-v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Tag de versão do release (ex: v2.1.0)'
        required: false
        default: 'v2.1.0'

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK 10
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Restore NuGet Dependencies (win-x64)
      run: |
        dotnet restore _projetos_futuros/ft-pdf/FtPdf.csproj -r win-x64
        dotnet restore ft-pdf-lite/FtPdfLite.csproj -r win-x64

    - name: Build FT PDF & FT PDF Lite
      run: |
        dotnet build _projetos_futuros/ft-pdf/FtPdf.csproj -c Release -r win-x64 --no-restore
        dotnet build ft-pdf-lite/FtPdfLite.csproj -c Release -r win-x64 --no-restore

    - name: Publish FT PDF (Edição Completa)
      run: |
        dotnet publish _projetos_futuros/ft-pdf/FtPdf.csproj -c Release -r win-x64 -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true --self-contained true -o ./publish-ft-pdf

    - name: Publish FT PDF Lite (Edição Ultraleve)
      run: |
        dotnet publish ft-pdf-lite/FtPdfLite.csproj -c Release -r win-x64 -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true --self-contained true -o ./publish-ft-pdf-lite

    - name: Package Release ZIPs
      shell: pwsh
      run: |
        Compress-Archive -Path ./publish-ft-pdf/* -DestinationPath ./FT-PDF-Windows-x64.zip -Force
        Compress-Archive -Path ./publish-ft-pdf-lite/* -DestinationPath ./FT-PDF-Lite-Windows-x64.zip -Force

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FT-PDF-Windows-x64
        path: |
          ./publish-ft-pdf/
          ./publish-ft-pdf-lite/

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name || inputs.version_tag }}
        name: "FT PDF ${{ github.ref_name || inputs.version_tag }} (Completo e Lite)"
        body: |
          ### 🚀 Lançamento Oficial FT PDF & FT PDF Lite - ${{ github.ref_name || inputs.version_tag }}
          
          Neste release você encontra os binários oficiais para Windows (64-bit):
          
          - **FT PDF (Edição Completa):** Leitor e editor com aceleração por hardware, abas, caixa de texto flutuante, notas, assinaturas e diagnóstico.
          - **FT PDF Lite (Edição Ultraleve):** Focado exclusivamente em leitura instantânea, abas, alta fidelidade e bloco de notas integrado.
          - **Suporte a Documentos Protegidos:** Abertura e visualização com solicitação e validação de senha.
          - **Ajuste Inteligente de Tela:** Adaptação automática para diferentes resoluções e monitores sem corte de interface ou botões.
          - **Fix Crítico de Inicialização:** Biblioteca nativa PDFium integrada e auto-extraível diretamente dentro do executável único.
          
          Ambos funcionam diretamente com 2 cliques, 100% Self-Contained (zero dependência de .NET instalado).
        files: |
          ./publish-ft-pdf/FtPdf.exe
          ./FT-PDF-Windows-x64.zip
          ./publish-ft-pdf-lite/FtPdfLite.exe
          ./FT-PDF-Lite-Windows-x64.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

